<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>404 • Out of Bounds • FOB Lagos</title>

  <link rel="stylesheet" href="/assets/css/tokens.css">

<body class="ground-ink">

  <header class="fob-header">
    <div class="fob-header__inner">
      <nav class="fob-nav-pill" aria-label="Main Navigation">
        <a href="/" class="fob-logo"><span>F</span><span class="fob-logo__o">O</span><span>B</span></a>

          <a href="/" class="fob-btn fob-btn--primary fob-btn--sm">Back to Home</a>

  <main id="main-content">

      <!-- Playful Bouncing O (ANI-16, ILL-80) -->

      <span class="fob-section-tag" style="color: var(--fob-volt);">Error 404</span>
      <h1 style="font-size: clamp(2.5rem, 6vw, 4.5rem); font-weight: 900; color: #FFF; text-transform: uppercase; line-height: 1;">
        Out of Bounds
      </h1>
      <p style="color: var(--fob-white-70); font-size: 1.25rem; max-width: 45ch;">

      </p>

      <div style="display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 1rem;">
        <a href="/" class="fob-btn fob-btn--primary fob-btn--lg">
          Back to FOB Home
        </a>
        <a href="/football-viewing/" class="fob-btn fob-btn--secondary fob-btn--lg">
          Check Today's Matches
        </a>
      </div>
    </div>
  </main>

  <footer class="fob-footer">
    <div class="fob-container">
      <div class="fob-footer__bottom">
        <div>&copy; 2026 FOB Recreational Centre Lagos.</div>
        <div class="fob-footer__legal"><a href="/privacy/">Privacy</a><a href="/terms/">Terms</a></div>

  <script type="module" src="/assets/js/main.js"></script>
