<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="gaming-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140E36"/>
      <stop offset="100%" stop-color="#0E0E2C"/>
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#gaming-bg)"/>

  <!-- Grid Lines -->
  <g opacity="0.1" stroke="#8B5CF6" stroke-width="1.5">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Center Gaming Monitor Screen -->
  <rect x="220" y="70" width="360" height="210" rx="14" fill="#0E0E2C" stroke="#8B5CF6" stroke-width="4" filter="url(#neon-glow)"/>
  <rect x="230" y="80" width="340" height="190" rx="8" fill="#1C1445"/>

  <!-- Screen Content: Game Action & HUD -->
  <path d="M 230,230 Q 340,160 400,200 T 570,180 L 570,270 L 230,270 Z" fill="#8B5CF6" opacity="0.3"/>
  <circle cx="400" cy="150" r="32" fill="none" stroke="#D7FF1F" stroke-width="3" stroke-dasharray="6,4"/>
  <polygon points="392,138 414,150 392,162" fill="#D7FF1F"/>

  <!-- Stand -->
  <rect x="385" y="280" width="30" height="50" fill="#2A1E63"/>
  <rect x="330" y="325" width="140" height="12" rx="6" fill="#8B5CF6"/>

  <!-- Huge Game Controller Foreground (Purple & Volt) -->
  <g transform="translate(400, 340)">
    <!-- Controller Body -->
    <path d="M -140,-40 C -190,-40 -200,60 -150,90 C -120,105 -90,40 -60,40 C -30,40 30,40 60,40 C 90,40 120,105 150,90 C 200,60 190,-40 140,-40 C 90,-40 60,-20 0,-20 C -60,-20 -90,-40 -140,-40 Z" fill="#0E0E2C" stroke="#8B5CF6" stroke-width="5"/>

    <!-- D-Pad -->
    <rect x="-105" y="-12" width="26" height="8" rx="2" fill="#8B5CF6"/>
    <rect x="-96" y="-21" width="8" height="26" rx="2" fill="#8B5CF6"/>

    <!-- Action Buttons -->
    <circle cx="85" cy="-7" r="6" fill="#D7FF1F"/>
    <circle cx="103" cy="-7" r="6" fill="#00D1FF"/>
    <circle cx="94" cy="-16" r="6" fill="#FF3DA5"/>
    <circle cx="94" cy="2" r="6" fill="#FF6B1A"/>

    <!-- Thumbsticks -->
    <circle cx="-42" cy="18" r="16" fill="#25164E" stroke="#8B5CF6" stroke-width="3"/>
    <circle cx="-42" cy="18" r="8" fill="#8B5CF6"/>
    <circle cx="42" cy="18" r="16" fill="#25164E" stroke="#8B5CF6" stroke-width="3"/>
    <circle cx="42" cy="18" r="8" fill="#8B5CF6"/>

    <!-- Center FOB Logo on Controller -->
    <circle cx="0" cy="-6" r="10" fill="none" stroke="#D7FF1F" stroke-width="3"/>
  </g>
</svg>
