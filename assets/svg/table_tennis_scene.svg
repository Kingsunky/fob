<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="tt-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08182B"/>
      <stop offset="100%" stop-color="#0E0E2C"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#tt-bg)"/>

  <!-- Table Perspective -->
  <polygon points="120,330 680,330 580,180 220,180" fill="#00D1FF" opacity="0.15" stroke="#00D1FF" stroke-width="4"/>
  <polygon points="140,320 660,320 565,190 235,190" fill="#0E243A"/>

  <!-- Center White Line -->
  <line x1="400" y1="190" x2="400" y2="320" stroke="#FFFFFF" stroke-width="3"/>

  <!-- Net -->
  <polygon points="190,250 610,250 610,210 190,210" fill="rgba(255, 255, 255, 0.25)" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="190" y1="210" x2="610" y2="210" stroke="#FFFFFF" stroke-width="4"/>

  <!-- Net Mesh pattern -->
  <g stroke="rgba(255,255,255,0.4)" stroke-width="1">
    <line x1="230" y1="210" x2="230" y2="250"/>
    <line x1="270" y1="210" x2="270" y2="250"/>
    <line x1="310" y1="210" x2="310" y2="250"/>
    <line x1="350" y1="210" x2="350" y2="250"/>
    <line x1="390" y1="210" x2="390" y2="250"/>
    <line x1="430" y1="210" x2="430" y2="250"/>
    <line x1="470" y1="210" x2="470" y2="250"/>
    <line x1="510" y1="210" x2="510" y2="250"/>
    <line x1="550" y1="210" x2="550" y2="250"/>
  </g>

  <!-- Left Paddle -->
  <g transform="translate(210, 160) rotate(-25)">
    <circle cx="0" cy="0" r="46" fill="#FF2E4D" stroke="#0E0E2C" stroke-width="4"/>
    <rect x="-8" y="42" width="16" height="50" rx="6" fill="#C28A4A" stroke="#0E0E2C" stroke-width="3"/>
  </g>

  <!-- Right Paddle -->
  <g transform="translate(590, 290) rotate(35)">
    <circle cx="0" cy="0" r="46" fill="#0E0E2C" stroke="#00D1FF" stroke-width="5"/>
    <rect x="-8" y="42" width="16" height="50" rx="6" fill="#C28A4A" stroke="#0E0E2C" stroke-width="3"/>
  </g>

  <!-- Ping Pong Ball with Motion Arc -->
  <path d="M 230,160 Q 360,90 440,150 T 560,250" fill="none" stroke="#D7FF1F" stroke-width="3" stroke-dasharray="8,6" opacity="0.8"/>
  <circle cx="440" cy="150" r="14" fill="#D7FF1F" stroke="#0E0E2C" stroke-width="3"/>
</svg>
