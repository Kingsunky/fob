<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="events-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B1242"/>
      <stop offset="100%" stop-color="#0E0E2C"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#events-bg)"/>

  <!-- Confetti & Celebration Streamers (ILL-06) -->
  <g opacity="0.8">
    <polygon points="120,40 135,45 130,60 115,55" fill="#D7FF1F"/>
    <circle cx="210" cy="80" r="8" fill="#FF3DA5"/>
    <rect x="280" y="30" width="12" height="12" rx="3" fill="#00D1FF" transform="rotate(25 286 36)"/>
    <polygon points="680,60 695,65 690,80 675,75" fill="#FF6B1A"/>
    <circle cx="580" cy="90" r="10" fill="#D7FF1F"/>
    <rect x="500" y="45" width="14" height="14" rx="4" fill="#1ED760" transform="rotate(-30 507 52)"/>
    <path d="M 60,110 Q 90,80 120,120 T 180,100" fill="none" stroke="#D7FF1F" stroke-width="4"/>
    <path d="M 620,110 Q 660,80 700,130" fill="none" stroke="#FF3DA5" stroke-width="4"/>
  </g>

  <!-- Giant Trophy with FOB Volt O -->
  <g transform="translate(400, 220)">
    <!-- Base -->
    <rect x="-80" y="110" width="160" height="30" rx="8" fill="#1A1A4A" stroke="#D7FF1F" stroke-width="3"/>
    <rect x="-60" y="70" width="120" height="40" rx="4" fill="#0E0E2C" stroke="#D7FF1F" stroke-width="2"/>
    <text x="0" y="96" fill="#D7FF1F" font-family="'Outfit', sans-serif" font-weight="900" font-size="16" text-anchor="middle" letter-spacing="2">FOB CREW</text>

    <!-- Stem -->
    <path d="M -25,70 L -15,10 L 15,10 L 25,70 Z" fill="#D7FF1F"/>

    <!-- Cup Body -->
    <path d="M -80,-120 C -80,-10 -50,10 0,10 C 50,10 80,-10 80,-120 Z" fill="#D7FF1F" stroke="#0E0E2C" stroke-width="4"/>

    <!-- Inside Cutout O -->
    <circle cx="0" cy="-60" r="28" fill="#0E0E2C"/>
    <circle cx="0" cy="-60" r="16" fill="#D7FF1F"/>

    <!-- Handles -->
    <path d="M -80,-100 C -130,-100 -120,-30 -70,-30" fill="none" stroke="#D7FF1F" stroke-width="12" stroke-linecap="round"/>
    <path d="M 80,-100 C 130,-100 120,-30 70,-30" fill="none" stroke="#D7FF1F" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Stars -->
  <polygon points="400,-20 406,-4 423,-4 409,6 414,22 400,12 386,22 391,6 377,-4 394,-4" fill="#D7FF1F" transform="translate(0, 70) scale(1.5)"/>
</svg>
