<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="map-water" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1E3A"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>
  </defs>

  <!-- Deep ink land mass -->
  <rect width="800" height="480" fill="#0E0E2C"/>

  <!-- Water bodies (Lagos Lagoon / Atlantic shoreline feel) -->
  <path d="M 0,380 Q 240,320 450,360 T 800,340 L 800,480 L 0,480 Z" fill="url(#map-water)" stroke="#2F3CFF" stroke-width="2"/>
  <path d="M 0,0 L 260,0 Q 200,80 120,90 T 0,160 Z" fill="url(#map-water)" stroke="#2F3CFF" stroke-width="2"/>

  <!-- Major Roads in Lekki / Victoria Island styling -->
  <g stroke="#1F1F4D" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 0,210 Q 300,190 520,240 T 800,210"/>
    <path d="M 400,0 L 400,360"/>
    <path d="M 220,120 L 580,360"/>
    <path d="M 620,100 L 280,360"/>
  </g>

  <!-- Admiralty Way Highlight Road (Volt Accent) -->
  <path d="M 280,180 Q 420,220 540,190" fill="none" stroke="#2F3CFF" stroke-width="8" stroke-linecap="round"/>
  <path d="M 330,195 Q 420,220 480,210" fill="none" stroke="#D7FF1F" stroke-width="4" stroke-linecap="round" stroke-dasharray="8,6"/>

  <!-- Minor grid lines -->
  <g stroke="#18183E" stroke-width="3">
    <line x1="200" y1="180" x2="200" y2="300"/>
    <line x1="300" y1="120" x2="300" y2="280"/>
    <line x1="500" y1="140" x2="500" y2="320"/>
    <line x1="600" y1="180" x2="600" y2="340"/>
    <line x1="120" y1="260" x2="700" y2="260"/>
  </g>

  <!-- FOB Location Pin (Lekki Phase 1) -->
  <g transform="translate(420, 205)">
    <!-- Pulse ring -->
    <circle cx="0" cy="-36" r="32" fill="none" stroke="#D7FF1F" stroke-width="2" opacity="0.4"/>
    <!-- Pin shadow -->
    <ellipse cx="0" cy="0" rx="14" ry="6" fill="#000000" opacity="0.5"/>
    <!-- Pin body -->
    <path d="M 0,0 C -18,-18 -24,-36 -24,-48 C -24,-62 -12,-72 0,-72 C 12,-72 24,-62 24,-48 C 24,-36 18,-18 0,0 Z" fill="#0E0E2C" stroke="#D7FF1F" stroke-width="4"/>
    <!-- Inner Volt O -->
    <circle cx="0" cy="-48" r="10" fill="#D7FF1F"/>
    <circle cx="0" cy="-48" r="5" fill="#0E0E2C"/>
  </g>

  <!-- Map Labels -->
  <text x="420" y="275" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-weight="900" font-size="18" text-anchor="middle">FOB RECREATION CENTRE</text>
  <text x="420" y="295" fill="#D7FF1F" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" text-anchor="middle">2, Lawani Ode Street, Ashipa, Ayobo</text>
</svg>
