<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <!-- FOB Primary Wordmark (ILL-01) -->
  <symbol id="fob-wordmark" viewBox="0 0 160 52">
    <rect width="160" height="52" rx="26" fill="#0E0E2C"/>
    <text x="32" y="36" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-weight="900" font-size="34" letter-spacing="-1">F</text>
    <circle cx="80" cy="26" r="15" fill="none" stroke="#D7FF1F" stroke-width="8"/>
    <text x="105" y="36" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-weight="900" font-size="34" letter-spacing="-1">B</text>
  </symbol>

  <!-- Iconic O Mark (ILL-02) -->
  <symbol id="fob-o" viewBox="0 0 48 48">
    <circle cx="24" cy="24" r="16" fill="none" stroke="#D7FF1F" stroke-width="8"/>
  </symbol>

  <!-- Zone Os (ILL-3x) -->
  <!-- 1. Football Pitch O (Pitch green #1ED760) -->
  <symbol id="zone-pitch" viewBox="0 0 64 64">
    <circle cx="32" cy="32" r="24" fill="#0E0E2C" stroke="#1ED760" stroke-width="6"/>
    <polygon points="32,20 40,26 37,36 27,36 24,26" fill="#1ED760"/>
    <line x1="32" y1="20" x2="32" y2="12" stroke="#1ED760" stroke-width="3"/>
    <line x1="40" y1="26" x2="48" y2="24" stroke="#1ED760" stroke-width="3"/>
    <line x1="37" y1="36" x2="43" y2="44" stroke="#1ED760" stroke-width="3"/>
    <line x1="27" y1="36" x2="21" y2="44" stroke="#1ED760" stroke-width="3"/>
    <line x1="24" y1="26" x2="16" y2="24" stroke="#1ED760" stroke-width="3"/>
  </symbol>

  <!-- 2. Football Viewing O (Magenta #FF3DA5) -->
  <symbol id="zone-viewing" viewBox="0 0 64 64">
    <circle cx="32" cy="32" r="24" fill="#0E0E2C" stroke="#FF3DA5" stroke-width="6"/>
    <rect x="22" y="22" width="20" height="16" rx="3" fill="none" stroke="#FF3DA5" stroke-width="3"/>
    <polygon points="29,26 37,30 29,34" fill="#FF3DA5"/>
    <line x1="26" y1="42" x2="38" y2="42" stroke="#FF3DA5" stroke-width="3"/>
  </symbol>

  <!-- 3. Gym O (Red #FF2E4D) -->
  <symbol id="zone-gym" viewBox="0 0 64 64">
    <circle cx="32" cy="32" r="24" fill="#0E0E2C" stroke="#FF2E4D" stroke-width="6"/>
    <line x1="18" y1="32" x2="46" y2="32" stroke="#FF2E4D" stroke-width="4" stroke-linecap="round"/>
    <rect x="22" y="24" width="4" height="16" rx="2" fill="#FF2E4D"/>
    <rect x="38" y="24" width="4" height="16" rx="2" fill="#FF2E4D"/>
    <rect x="18" y="27" width="3" height="10" rx="1.5" fill="#FF2E4D"/>
    <rect x="43" y="27" width="3" height="10" rx="1.5" fill="#FF2E4D"/>
  </symbol>

  <!-- 4. Basketball O (Orange #FF6B1A) -->
  <symbol id="zone-basketball" viewBox="0 0 64 64">
    <circle cx="32" cy="32" r="24" fill="#0E0E2C" stroke="#FF6B1A" stroke-width="6"/>
    <line x1="8" y1="32" x2="56" y2="32" stroke="#FF6B1A" stroke-width="3"/>
    <path d="M 18,14 Q 32,32 18,50" fill="none" stroke="#FF6B1A" stroke-width="3"/>
    <path d="M 46,14 Q 32,32 46,50" fill="none" stroke="#FF6B1A" stroke-width="3"/>
  </symbol>

  <!-- 5. Snooker O (Cyan #00D1FF) -->
  <symbol id="zone-snooker" viewBox="0 0 64 64">
    <circle cx="32" cy="32" r="24" fill="#0E0E2C" stroke="#00D1FF" stroke-width="6"/>
    <circle cx="32" cy="32" r="10" fill="#00D1FF"/>
    <circle cx="32" cy="28" r="3.5" fill="#0E0E2C"/>
    <circle cx="32" cy="35" r="4.5" fill="#0E0E2C"/>
  </symbol>

  <!-- 6. Table Tennis O (Cyan #00D1FF) -->
  <symbol id="zone-table-tennis" viewBox="0 0 64 64">
    <circle cx="32" cy="32" r="24" fill="#0E0E2C" stroke="#00D1FF" stroke-width="6"/>
    <circle cx="28" cy="28" r="10" fill="none" stroke="#00D1FF" stroke-width="3"/>
    <line x1="35" y1="35" x2="44" y2="44" stroke="#00D1FF" stroke-width="4" stroke-linecap="round"/>
    <circle cx="40" cy="22" r="3" fill="#00D1FF"/>
  </symbol>

  <!-- 7. Gaming O (Purple #8B5CF6) -->
  <symbol id="zone-gaming" viewBox="0 0 64 64">
    <circle cx="32" cy="32" r="24" fill="#0E0E2C" stroke="#8B5CF6" stroke-width="6"/>
    <path d="M 20,38 L 24,24 L 40,24 L 44,38 Q 32,34 20,38 Z" fill="none" stroke="#8B5CF6" stroke-width="3" stroke-linejoin="round"/>
    <line x1="26" y1="30" x2="30" y2="30" stroke="#8B5CF6" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="28" y1="28" x2="28" y2="32" stroke="#8B5CF6" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="36" cy="29" r="1.5" fill="#8B5CF6"/>
    <circle cx="39" cy="32" r="1.5" fill="#8B5CF6"/>
  </symbol>

